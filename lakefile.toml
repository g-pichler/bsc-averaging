name = "BSCAveraging"
version = "1.0.0"
defaultTargets = ["BSCAveraging", "Submission", "Solutions"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Pinned to the mathlib release tag `v4.32.0` (commit 81a5d257c8), which is
# built with Lean v4.32.0 — keep this in sync with `lean-toolchain`.  The tag is
# on `master`; the patch tags `v4.32.1` and `v4.32.2` are release-branch commits
# and are not ancestors of `master`, which Comparator rejects.
rev = "81a5d257c8e410db227a6665ed08f64fea08e997"

# The development: MathOverflow 285151 and the two `p = 0` conjectures of
# Dikshtein-Ordentlich-Shamai, Entropy 24(9):1321.
[[lean_lib]]
name = "BSCAveraging"

# The Palomar Challenge: one module stating all three theorems, self-contained
# and importing Mathlib only.
[[lean_lib]]
name = "Submission"

# The Solution, discharging all three from the library.  It sits under its own
# root component: Comparator puts the protected Challenge directory first on
# `LEAN_PATH`, and Lean resolves a module by its root component alone, so a
# Solution sharing the Challenge's root is looked for in that directory and not
# found (PalomarSubmission issue 108).
[[lean_lib]]
name = "Solutions"
