version: v0.4

project:
  name: BSCAveraging
  description: |-
    Three theorems about binary channels on a doubly symmetric binary source: a pair (𝑋, 𝑌) of
    Bernoulli(1/2) bits with P(𝑋 ≠ 𝑌) = 𝑝, together with Markov chains 𝑈 - 𝑋 - 𝑌 - 𝑉 in which 𝑈
    and 𝑉 are the outputs of two independent binary channels applied to 𝑋 and to 𝑌. Let 𝒜 be the
    set of rate triples (𝑅₀, 𝑅₁, 𝑅₂) with 𝐼(𝑈;𝑋) ≤ 𝑅₁, 𝐼(𝑌;𝑉) ≤ 𝑅₂ and 𝑅₀ ≤ 𝐼(𝑈;𝑉) attainable by
    arbitrary binary channels on the two sides, and ℬ the same set with both channels restricted
    to be binary symmetric.

    (1) conv 𝒜 = conv ℬ for every 𝑝 in [0,1]. (2) At 𝑝 = 0, no pair of binary channels whose rates
    do not exceed those of the Z-channel with parameter 𝑎 and the S-channel with parameter 𝑑
    attains a larger 𝐼(𝑈;𝑉) than that pair does. (3) At 𝑝 = 0, no pair of binary channels whose
    rates are at least those of the Z-channels with parameters 𝑎 and 𝑑 attains a smaller 𝐼(𝑈;𝑉)
    than that pair does. Here 𝑎, 𝑑 range over (0,1).
  authors:
    - Georg Pichler
  responsible_maintainers:
    - Georg Pichler
  license: Apache-2.0

classification:
  arxiv: [cs.IT, math.IT]
  msc2020: [94A17, 94A15, 94A40, 94A34, 26D07]

automation:
  methods:
    - method: agent
      note: |-
        An AI coding agent wrote the Lean sources; the author directed the work and reviewed the statements and the proof architecture.
  tool_setup: |-
    The Lean sources were produced by an AI coding agent working under the
    author's direction, with the author reviewing the statements and the overall proof
    architecture. `BSCAveraging/Exploration/NOTES.md` is the working log kept during that process, organised
    by attempted route rather than by the final argument; many routes recorded there were refuted
    and are retained for that reason. `BSCAveraging/Exploration/` holds results that were proved
    along the way but are not used by any of the three theorems. Supporting numerical exploration
    is in `BSCAveraging/Exploration/numerics/` (Python; not part of any proof). Costs, hardware and wall time
    were not recorded.

review:
  status: self-assessed
  notes: |-
    The author checked the three Challenge statements against the cited sources
    and reviewed the proof architecture; no separate reviewer was involved. Mechanical checks
    performed before submission: `lake build` of the whole development, and `#print axioms` for
    every theorem on the proof path (`BSCAveraging/Basic.lean`).

    Novelty has not been independently established. MathOverflow 285151 has no answer and no
    comments (StackExchange API, asked 2017-11-03). The Dikshtein-Ordentlich-Shamai paper has one
    recorded citing work, a 2024 Entropy editorial that mentions the setting but not the
    conjectures, and no resolution of either conjecture was found. Mathlib at the pinned revision
    contains no mutual information at all, and no prior Lean formalization of any of the three
    problems was found. That search is the author's own and is not offered as evidence of
    priority.

scope: |-
  This configuration selects all three theorems of the development:
  BSCAveraging.MO285151.averaged_bsc_maximise_mutual_information,
  BSCAveraging.DSIB.conjecture1_p0 and BSCAveraging.DSIB.conjecture2_p0. Known gaps and
  restrictions: (i) the two conjecture theorems hold at p = 0 only, the only case the
  Dikshtein-Ordentlich-Shamai paper states them for; (ii) binary U and V throughout, the
  reduction to binary test channels (Proposition 3 of that paper) being cited and not formalized, so the two
  conjecture theorems read as statements about R(Cu, Cv, 0) are conditional on it, while for
  MathOverflow 285151 the binary restriction is the setting of the source question and costs
  nothing; (iii) optimality form, not uniqueness of the optimiser: the conjecture theorems say the
  conjectured pair is not beaten, not that it is the only optimum; (iv) the two computed steps,
  both in Conjecture 1 (an 88-cell interval sweep and the 24129-coefficient Polya certificate of
  the kernel lemma, the latter checked by Kronecker substitution in BSCAveraging/KernelKron.lean),
  run in the Lean kernel; all three theorems' axioms are exactly propext, Classical.choice and
  Quot.sound.

sources:
  - title: "Three problems on binary channels for a doubly symmetric binary source: conv 𝒜 = conv ℬ, and the two p = 0 conjectures of Dikshtein-Ordentlich-Shamai"
    type: original-proof
    relationship: other
    note: |-
      First presentation of the three results. MathOverflow 285151 was unanswered; the two conjectures were published in 2022 with numerical evidence only.
  - title: "The Double-Sided Information Bottleneck Function"
    type: paper
    relationship: background
    url: https://doi.org/10.3390/e24091321
    authors:
      - "Michael Dikshtein"
      - "Or Ordentlich"
      - "Shlomo Shamai (Shitz)"
    note: |-
      Entropy 24(9):1321 (2022). States Conjectures 1 and 2, proved here at p = 0 in value form. Its Proposition 3 is the cardinality reduction to binary test channels that the Lean statements assume and do not formalize, and its Remark 5 is the identity that turns Conjecture 2 into the minimisation form used here.
  - title: "Distributed Information-Theoretic Clustering"
    type: paper
    relationship: background
    url: https://doi.org/10.1093/imaiai/iaab007
    authors:
      - "Georg Pichler"
      - "Pablo Piantanida"
      - "Gerald Matz"
    note: |-
      Information and Inference 11 (2022). Cited for Conjecture 5.2, which result (1) settles, and for Proposition 4.3, conv(S_i) = conv(R_i), which result (1) uses.
  - title: "Do averaged binary symmetric channels maximize mutual information?"
    type: other
    relationship: background
    url: https://mathoverflow.net/q/285151
    authors:
      - "Georg Pichler"
    note: |-
      MathOverflow 285151 (2017), unanswered. The source question for result (1).
